[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mashup-studio"
version = "1.0.0"
description = "Find vocal and instrumental pairs in your own music library and arrange full-length mashups, in a local web page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The versions the Studio is tested with (Apple Silicon). numpy, scipy and numba are pinned too: librosa's tempo and
# key code runs on numba, which allows only some numpy versions.
dependencies = [
    "torch==2.15.0",
    "torchaudio==2.11.1",
    "demucs==4.1.0",
    "beat-this==1.1.0",
    "einops==0.8.2",
    "rotary-embedding-torch==0.9.1",
    "soxr==1.1.0",
    "librosa==0.11.0",
    "numba==0.68.1",
    "soundfile==0.14.0",
    "scipy==1.18.1",
    "numpy==2.5.4",
    "huggingface_hub==2.4.0",
]

[project.scripts]
mf = "mashup_finder.cli:main"

[tool.setuptools]
packages = ["mashup_finder"]

[tool.setuptools.package-data]
mashup_finder = ["*.html", "*.css"]
